name: syncthing
disabled: false
buildsystem: simple
build-options:
  env:
    GOBIN: /app/bin
    # build-args:
    #    - --share=network

build-commands:
  - |
    . /usr/lib/sdk/golang/enable.sh
    export GOPATH=$PWD/go
    go version
    # go mod vendor
    #go build -mod=vendor
    #go mod download -json > download.json
    env GOFLAGS=-mod=vendor go run build.go -no-upgrade build
  - install -Dm755 -t /app/bin syncthing
  - syncthing -version

sources:
  - go-sources.json

  - type: archive
    url: 
      https://github.com/syncthing/syncthing/releases/download/v1.30.0/syncthing-source-v1.30.0.tar.gz
    sha256: ef1be71c66753c04212ab1c9c548e678d468bad98dc5461e83540a4ef5c2fcba
    x-checker-data:
      type: anitya
      project-id: 11814
      url-template: 
        https://github.com/syncthing/syncthing/releases/download/v$version/syncthing-source-v$version.tar.gz
      versions:
        <: '2'

